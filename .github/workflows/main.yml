name: CI

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: ./util/linux-builder/build-in-docker.sh

    - uses: actions/upload-artifact@v4
      with:
        name: vial-linux
        path: util/linux-builder/output/Vial-x86_64.AppImage

  # Native Apple Silicon build with PyInstaller (see util/macos/README.md). macos-15 runners are arm64.
  build-mac-arm64:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup venv
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r util/macos/requirements.txt
        pip install --no-deps "fbs==0.9.0"

    - name: Build
      run: VIAL_ARCH=arm64 ./util/macos/build.sh

    - uses: actions/upload-artifact@v4
      with:
        name: vial-mac-arm64
        path: target/macos-arm64/vial-mac-arm64.dmg

  # On a "v*" tag, publish the macOS (arm64) and Windows (x64) builds as a GitHub Release so that
  # https://github.com/<owner>/<repo>/releases/latest/download/<file> always serves the newest one.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac-arm64, build-win]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: vial-mac-arm64
        path: release

    - uses: actions/download-artifact@v4
      with:
        pattern: vial-win*
        merge-multiple: true
        path: release

    - name: Name the Windows files by architecture
      run: |
        mv release/VialSetup.exe release/vial-win-x64-setup.exe
        mv release/vial-win.zip release/vial-win-x64.zip
        ls -l release

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          release/vial-mac-arm64.dmg
          release/vial-win-x64-setup.exe
          release/vial-win-x64.zip
        generate_release_notes: true

  # Windows x64 (AMD64) only
  build-win:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.6.x'
        architecture: x64

    - name: Setup venv
      run: |
        python -m venv venv
        . .\venv\Scripts\activate.ps1
        pip install -r requirements.txt

    - name: Install NSIS
      run: |
        Invoke-WebRequest "https://github.com/vial-kb/vial-deps/releases/download/v1/nsis-3.06.1-setup.exe" -UserAgent "wget" -OutFile nsis-3.06.1-setup.exe
        if ((Get-FileHash nsis-3.06.1-setup.exe -Algorithm sha256).Hash -ne "f60488a676308079bfdf6845dc7114cfd4bbff47b66be4db827b89bb8d7fdc52") { Write-Error 'SHA256 mismatch' }
        Start-Process -FilePath "nsis-3.06.1-setup.exe" -ArgumentList "/S", "/D=C:\Program Files (x86)\NSIS" -NoNewWindow -Wait

    - name: Install Visual C++ Redistributable
      run: |
        Invoke-WebRequest -Uri "https://download.microsoft.com/download/3/2/2/3224B87F-CFA0-4E70-BDA3-3DE650EFEBA5/vcredist_x64.exe" -OutFile "vcredist_x64.exe"
        Start-Process -FilePath "vcredist_x64.exe" -ArgumentList "/install", "/quiet", "/norestart" -Wait
        Remove-Item "vcredist_x64.exe"

    - name: Build
      run: |
        . .\venv\Scripts\activate.ps1
        fbs freeze
        Compress-Archive -Path "target\Vial" -DestinationPath vial-win.zip

    - uses: actions/upload-artifact@v4
      with:
        name: vial-win
        path: vial-win.zip

    - name: Create installer
      run: |
        $env:Path += ";C:\Program Files (x86)\NSIS"
        . .\venv\Scripts\activate.ps1
        fbs installer

    - uses: actions/upload-artifact@v4
      with:
        name: vial-win-installer
        path: target\VialSetup.exe
