name: Web

# Browser version (web/): built with emscripten and published to GitHub Pages at
# https://digitarhythm.github.io/KeRT-Keymapper/ on every version tag, or on demand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # The emscripten SDK and the wasm builds of CPython, Qt and PyQt5 take ~40 minutes and only change
    # when their versions or patches do; cache them so a normal run only links the app (a few minutes).
    - uses: actions/cache@v4
      id: deps
      with:
        path: |
          web/emsdk
          web/deps
        key: web-deps-${{ runner.os }}-${{ hashFiles('web/version.sh', 'web/fetch-emsdk.sh', 'web/fetch-deps.sh', 'web/build-deps.sh', 'web/patches/**') }}

    - name: Build dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      run: |
        cd web
        ./fetch-emsdk.sh
        ./fetch-deps.sh
        ./build-deps.sh

    - name: Build
      run: |
        cd web
        git clone --depth 1 https://github.com/vial-kb/via-keymap-precompiled.git
        cd src
        ./build.sh

    - uses: actions/upload-artifact@v4
      with:
        name: kert-keymapper-web
        path: web/src/build

    - uses: actions/upload-pages-artifact@v3
      with:
        path: web/src/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
