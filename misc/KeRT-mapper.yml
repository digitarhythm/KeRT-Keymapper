app: KeRT-mapper

ingredients:
  dist: xenial
  sources:
    - deb http://archive.ubuntu.com/ubuntu/ xenial main universe
  package: kert-mapper
  debs:
    - ../target/KeRT-mapper.deb

script:
  - cat > ./AppRun <<\EOF
  - #!/bin/sh
  - HERE=$(dirname $(readlink -f "${0}"))
  - export QT_QPA_PLATFORM=xcb
  - exec "${HERE}/opt/KeRT-mapper/KeRT-mapper" "$@"
  - EOF
  - chmod a+x ./AppRun
  - cp usr/share/icons/hicolor/256x256/apps/KeRT-mapper.png .
  - mv usr/share/applications/KeRT-mapper.desktop .
  - sed -i -e 's@^Version=.*@Version=1.0@g' KeRT-mapper.desktop
